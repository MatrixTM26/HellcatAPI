name: Build HellcatAPI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'output/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build With Maven
        run: |
          mvn clean package -DskipTests

      - name: Verify Build Output
        run: |
          echo "===== ROOT ====="
          ls -lah

          echo "===== TARGET ====="
          ls -lah target

      - name: Copy JAR To Output Folder
        run: |
          mkdir -p output

          JAR=$(find target \
            -type f \
            -name "*.jar" \
            ! -name "original-*.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No executable JAR found."
            exit 1
          fi

          cp "$JAR" output/HellcatAPI.jar

          echo "Copied:"
          ls -lah output

      - name: Commit Output To Repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add output/HellcatAPI.jar

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "ci: build #${{ github.run_number }} [skip ci]"
            git push
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HellcatAPI
          path: output/HellcatAPI.jar
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HellcatAPI Build #${{ github.run_number }}
          files: output/HellcatAPI.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}